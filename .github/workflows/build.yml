name: Build plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag, like v1.0 (leave empty to only build)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Package
        run: cp README.md OFL-Silkscreen.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Boro-Plugins
          path: dist

  # A pushed v* tag, or a manual run given a tag name, publishes a GitHub
  # release with the zip to copy to the memory stick.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Boro-Plugins
          path: dist
      - name: Zip
        run: cd dist && zip -r "../Boro-Plugins-${TAG}.zip" .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "Boro-Plugins-${TAG}.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Boro Plugins $TAG" --notes "Copy the SEPLUGINS folder to the root of your memory stick and add the plugins to PLUGINS.TXT as the README explains."
