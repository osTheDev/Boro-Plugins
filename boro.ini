; Settings for the Boro plugins. Boro's Settings > Plugins page edits this
; file, or change a value here: on/off, or a number.

[bright]
; Brighter than the firmware allows on battery (steps 9 and 10). Drains it faster.
full_on_battery=off
; The bar at the bottom when brightness changes.
bar=on
; Steps 1 and 2, dimmer than the firmware goes. Turn off if they flicker.
extra_dim=on

[status]
; Battery % at the top right of the XMB, until SCREEN + L there changes it.
xmb=on
; SCREEN + L shows or hides the battery % in the XMB, or the corner in games; SCREEN + Triangle
; peeks at the time and battery for 3 seconds anywhere.
